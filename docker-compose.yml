version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-ulpin_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── ML Engine Service ──────────────────────────────────────────────────────
  # Builds from ml-engine/ (src/server.py FastAPI app).
  # Backend communicates with this via ML_ENGINE_URL=http://ml-engine:8001.
  # Enable: set ML_ENGINE_ENABLED=true in the backend/worker environment below.
  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ML_ENGINE_LOG_LEVEL=${ML_ENGINE_LOG_LEVEL:-INFO}
      - ML_ENGINE_WORKERS=${ML_ENGINE_WORKERS:-1}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-ulpin_db}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-sih2026-production-super-secret-key-3d-cadastre-jwt-secret-key-replace-in-prod}
      - ML_ENGINE_URL=${ML_ENGINE_URL:-http://ml-engine:8001}
      - ML_ENGINE_ENABLED=${ML_ENGINE_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.workers.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-ulpin_db}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-sih2026-production-super-secret-key-3d-cadastre-jwt-secret-key-replace-in-prod}
      - ML_ENGINE_URL=${ML_ENGINE_URL:-http://ml-engine:8001}
      - ML_ENGINE_ENABLED=${ML_ENGINE_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  pgdata:
