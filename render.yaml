services:
  # 1. Redis (Free Tier)
  - type: redis
    name: strata-redis
    ipAllowList: []
    plan: free

  # 2. Backend (Free Web Service)
  - type: web
    name: strata-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: strata-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: strata-redis
          property: connectionString
      - key: ML_ENGINE_ENABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true

databases:
  # 3. PostgreSQL Database (Free Tier - expires in 90 days on Render)
  - name: strata-db
    databaseName: ulpin_db
    user: postgres
    plan: free
