services:
  # 1. Redis (Free Tier)
  - type: redis
    name: strata-redis
    ipAllowList: []
    plan: free

  # 2. Backend (Free Web Service)
  - type: web
    name: strata-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: strata-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: strata-redis
          property: connectionString
      - key: ML_ENGINE_ENABLED
        value: "true"
      - key: ML_ENGINE_URL
        value: "http://strata-ml-engine:8001"
      - key: SECRET_KEY
        generateValue: true

  # 3. Worker (Free Background Worker)
  - type: worker
    name: strata-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "python -m app.workers.worker"
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: strata-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: strata-redis
          property: connectionString
      - key: ML_ENGINE_ENABLED
        value: "true"
      - key: ML_ENGINE_URL
        value: "http://strata-ml-engine:8001"
      - key: SECRET_KEY
        generateValue: true

  # 4. ML Engine (Free Web Service)
  - type: web
    name: strata-ml-engine
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./ml-engine
    plan: free

databases:
  # 5. PostgreSQL Database (Free Tier)
  - name: strata-db
    databaseName: ulpin_db
    user: postgres
    plan: free
