[tool.poetry]
name = "ml-engine"
version = "0.1.0"
description = "SIH 2026 PS 26011 - 3D Cadastral Mapping ML + Dataset + AI Engine"
authors = ["Team SIH 2026 PS 26011"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch = "^2.0"
numpy = "^1.24"
pandas = "^2.0"
geopandas = "^0.14"
shapely = "^2.0"
rasterio = "^1.3"
opencv-python = "^4.8"
scikit-learn = "^1.3"
trimesh = "^4.0"
jsonschema = "^4.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# NOTE: GDAL, PDAL, Open3D require environment-specific installation.
# Use conda or system package manager. Do not pip-install GDAL without version pinning.
